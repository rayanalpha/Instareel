version: "3.9"

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/app.db}
  SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-sqlite:////data/app.db}
  REDIS_URL: redis://redis:6379/0
  MEDIA_ROOT: /data/media

x-app-volumes: &app-volumes
  - appdata:/data
  - ./data:/data
  - ./media:/data/media

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-igfunnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-igfunnel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-igfunnel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info --concurrency=2 --pool=solo

  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery beat --loglevel=info

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:8000}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/srv/media:ro
    depends_on:
      - backend
      - frontend
    profiles: ["nginx"]

volumes:
  pgdata:
  redisdata:
  appdata:
