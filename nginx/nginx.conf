events {}
http {
  upstream backend { server backend:8000; }
  upstream frontend { server frontend:3000; }

  server {
    listen 80;

    # API + websocket
    location /api/ { proxy_pass http://backend; proxy_set_header Host $host; }
    location /ws {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /health { proxy_pass http://backend; }

    # FastAPI self-docs (not under /api/).
    location = /docs { proxy_pass http://backend; proxy_set_header Host $host; }
    location = /redoc { proxy_pass http://backend; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://backend; proxy_set_header Host $host; }

    # No direct media access: previews/thumbnails are served by the API
    # behind admin auth (/api/v1/videos/...). A public alias here would
    # bypass that and expose raw uploads, sessions-adjacent files included.

    # Everything else → Next.js
    location / { proxy_pass http://frontend; proxy_set_header Host $host; }
  }
}
